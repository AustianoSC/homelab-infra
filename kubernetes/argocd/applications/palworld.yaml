apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: palworld
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/AustianoSC/homelab-infra.git
    targetRevision: main
    path: kubernetes/apps/palworld
  destination:
    server: https://kubernetes.default.svc
    namespace: palworld
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
