# The ClusterSecretStore that connects External Secrets to 1Password. Only
# cluster-secret-store.yaml is picked up: values.yaml isn't a Kubernetes
# manifest.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-config
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/AustianoSC/homelab-infra.git
    targetRevision: main
    path: kubernetes/infra/external-secrets
    directory:
      include: cluster-secret-store.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # On a fresh cluster this is applied alongside the operator chart, before
      # its CRDs exist. Skip the check that would fail on that, and retry.
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
