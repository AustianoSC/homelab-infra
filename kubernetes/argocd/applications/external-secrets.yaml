# External Secrets Operator itself: the upstream chart, with this repo's
# values.yaml. The ClusterSecretStore is a separate Application
# (external-secrets-config.yaml) because it needs the CRDs this one installs.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 2.14.0
      helm:
        releaseName: external-secrets
        valueFiles:
          - $values/kubernetes/infra/external-secrets/values.yaml
    - repoURL: https://github.com/AustianoSC/homelab-infra.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The CRDs are too large for a client-side apply (the last-applied
      # annotation exceeds the size limit).
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
