# The only Application applied by hand. It watches kubernetes/argocd/applications
# and creates one Application per file there, so adding a workload is adding a
# file and merging it to main ("app of apps").
#
# There is deliberately no finalizer: deleting this Application leaves the child
# Applications, and the workloads they deployed, running.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/AustianoSC/homelab-infra.git
    targetRevision: main
    path: kubernetes/argocd/applications
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
