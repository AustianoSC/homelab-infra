# Points External Secrets at the 1Password vault `homelab-k8s`, using the
# service account token that `make eso-token` puts in the cluster. One store for
# every namespace; it can only read this vault. See ADR 0008.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: onepassword
spec:
  provider:
    onepasswordSDK:
      vault: homelab-k8s
      auth:
        serviceAccountSecretRef:
          name: onepassword-sa
          namespace: external-secrets
          key: token
