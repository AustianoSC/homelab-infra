# Address pools for MetalLB, all inside the LAN's 192.168.8.0/24 and outside the
# router's DHCP range (.100 - .249). See docs/adr/0005-metallb-over-servicelb.md.
---
# Game servers. Addresses here are only handed out to Services that ask for one
# by name, so Traefik or a test Service can never take a game IP. Friends'
# WireGuard AllowedIPs and the router firewall rule name this whole block.
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: games
  namespace: metallb-system
spec:
  addresses:
    - 192.168.8.48/29
  autoAssign: false
---
# Everything else: Traefik, web UIs. Assigned automatically.
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: general
  namespace: metallb-system
spec:
  addresses:
    - 192.168.8.56/29
---
# Layer 2 mode: one node answers ARP for each address. Works on any flat LAN
# with no router configuration.
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: lan
  namespace: metallb-system
spec:
  ipAddressPools:
    - games
    - general
