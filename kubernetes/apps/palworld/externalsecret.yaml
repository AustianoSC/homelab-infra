apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: palworld
  namespace: palworld
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: palworld
    creationPolicy: Owner
  data:
    - secretKey: PALWORLD_SERVER_PASSWORD
      remoteRef:
        key: palworld/server-password
    - secretKey: PALWORLD_ADMIN_PASSWORD
      remoteRef:
        key: palworld/admin-password
