[defaults]
inventory = inventory/hosts.yml
roles_path = roles
interpreter_python = auto_silent
callback_result_format = yaml
forks = 10

[ssh_connection]
# Nodes are recreated with new host keys on every rebuild; accept-new trusts a
# key the first time but still refuses one that changes underneath us. After a
# rebuild, clear the old keys with: ssh-keygen -R <node-ip>
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
pipelining = True
