---
- name: Create the k3s config directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"

# Written before the install so the agent joins with this config the first time.
- name: Write the k3s agent config
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    mode: "0600"
  notify: Restart k3s-agent

- name: Create the install script directory
  ansible.builtin.file:
    path: /usr/local/share/k3s
    state: directory
    mode: "0755"

- name: Download the install script for the pinned release
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/k3s-io/k3s/{{ k3s_version | urlencode }}/install.sh"
    dest: "/usr/local/share/k3s/install-{{ k3s_version }}.sh"
    mode: "0755"

- name: Read the installed k3s version
  ansible.builtin.command: /usr/local/bin/k3s --version
  register: k3s_agent_installed
  changed_when: false
  failed_when: false

- name: Install k3s agent {{ k3s_version }}
  ansible.builtin.command: "/usr/local/share/k3s/install-{{ k3s_version }}.sh"
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    INSTALL_K3S_EXEC: agent
  when: k3s_version not in (k3s_agent_installed.stdout | default(''))
  changed_when: true

- name: Enable and start the k3s agent
  ansible.builtin.systemd_service:
    name: k3s-agent
    enabled: true
    state: started

- name: Apply config changes before checking the node
  ansible.builtin.meta: flush_handlers

# Agents have no kubeconfig, so ask the server whether this node joined.
- name: Wait for the node to be Ready
  ansible.builtin.command: >-
    /usr/local/bin/k3s kubectl wait --for=condition=Ready
    node/{{ inventory_hostname }} --timeout=180s
  delegate_to: "{{ groups['k3s_server'][0] }}"
  changed_when: false
