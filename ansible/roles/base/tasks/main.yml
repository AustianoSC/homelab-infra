---
- name: Upgrade all packages
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    upgrade: dist

- name: Install base packages
  ansible.builtin.apt:
    name:
      - curl
      - unattended-upgrades
    state: present

- name: Set the timezone
  community.general.timezone:
    name: "{{ timezone }}"

- name: Enable unattended security upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

# Rebooting a node drains its workloads, so reboots stay a deliberate step
# rather than something that happens at 3am with players online.
- name: Never reboot automatically after unattended upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52unattended-upgrades-local
    mode: "0644"
    content: |
      Unattended-Upgrade::Automatic-Reboot "false";

# Kubernetes watches many files per pod; Ubuntu's defaults run out quickly and
# surface as "too many open files" in unrelated places.
- name: Raise inotify limits
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/90-k3s.conf
    reload: true
  loop:
    - { name: fs.inotify.max_user_instances, value: "8192" }
    - { name: fs.inotify.max_user_watches, value: "524288" }

- name: Create journald drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    mode: "0755"

- name: Cap journald disk use
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/10-size.conf
    mode: "0644"
    content: |
      [Journal]
      SystemMaxUse=500M
  notify: Restart journald

# The kubelet expects no swap. Ubuntu cloud images ship without any, so this
# only fails if something added it.
- name: Check that swap is off
  ansible.builtin.assert:
    that: ansible_facts['swaptotal_mb'] == 0
    fail_msg: "Swap is enabled on {{ inventory_hostname }}; the kubelet expects it off."
    quiet: true

- name: Check whether the upgrade needs a reboot
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: base_reboot_required

- name: Reboot to finish the upgrade
  ansible.builtin.reboot:
    reboot_timeout: 600
  when:
    - base_reboot_if_required
    - base_reboot_required.stat.exists
