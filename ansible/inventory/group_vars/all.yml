# hosts.yml next to this file is generated by OpenTofu; these variables are
# maintained by hand.

timezone: America/Los_Angeles

# Pinned k3s release. Changing it and re-running the playbook upgrades the
# cluster (server first, then agents). Current releases:
# https://update.k3s.io/v1-release/channels
k3s_version: v1.36.5+k3s1

k3s_server_ip: "{{ hostvars[groups['k3s_server'][0]]['ansible_host'] }}"
k3s_server_url: "https://{{ k3s_server_ip }}:6443"

# Injected by `op run --env-file=.env.tpl`. The token is baked into the cluster
# at install time, so it can't simply be changed later.
k3s_token: "{{ lookup('ansible.builtin.env', 'K3S_TOKEN') }}"

kubeconfig_local_path: ~/.kube/homelab.yaml
kubeconfig_context: homelab
