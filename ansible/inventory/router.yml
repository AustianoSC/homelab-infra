---
# Hand-written. hosts.yml next to this file is generated by OpenTofu, so the
# router has its own inventory. Use it with `-i inventory/router.yml` (the
# `make router` and `make router-check` targets do).
all:
  children:
    router:
      hosts:
        gl-be9300:
          ansible_host: 192.168.8.1
          ansible_user: root
          # The router's SSH server (Dropbear) has no post-quantum key exchange,
          # so OpenSSH prints a warning on every connection. Keep it out of the
          # task output.
          ansible_ssh_common_args: -o LogLevel=error
          # No terminal: output stays free of carriage returns, and a process the
          # role starts on the router isn't hung up on when the session ends.
          ansible_ssh_use_tty: false
          # The router has no SFTP server, so files go over the SSH connection
          # itself (`dd` on the other end) instead of through sftp or scp.
          ansible_ssh_transfer_method: piped
          # Where Ansible puts the script it uploads. /tmp is memory, so nothing
          # is written to the router's flash (~/.ansible is on it).
          ansible_remote_tmp: /tmp/.ansible-tmp
